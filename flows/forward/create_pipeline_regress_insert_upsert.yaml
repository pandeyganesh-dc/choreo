# One flow per connector + report: create_pipeline_<connector>_<report>.
# Insert Mode is preset to Upsert by the report (upsert key entity_id).
description: "Create a manual-run Insert: Upsert pipeline on Regression. Does not run it."
params:
  fields: all          # "all", or names as shown in the picker
outputs:
  pipeline: $p.name
steps:
  - startPipeline: { connector: Regression, type: "Insert: Upsert" }
  - selectFields: { fields: $fields }
  - savePipeline: { connector: Regression, as: p }
