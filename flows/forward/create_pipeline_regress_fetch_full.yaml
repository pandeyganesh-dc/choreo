# One flow per connector + report: create_pipeline_<connector>_<report>.
# Fetch Mode is preset to FULL by the report.
description: "Create a manual-run Fetch: Full pipeline on Regression. Does not run it."
params:
  fields: all          # "all", or names as shown in the picker
outputs:
  pipeline: $p.name
steps:
  - startPipeline: { connector: Regression, type: "Fetch: Full" }
  - selectFields: { fields: $fields }
  - savePipeline: { connector: Regression, as: p }
