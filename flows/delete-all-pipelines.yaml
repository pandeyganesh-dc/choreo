description: Delete every pipeline a user can see on a connector (first page of the list), going there once
params:
  connector:           # required: which connector
steps:
  - goToConfiguredPipelines: { connector: $connector }
  - listPipelines: { connector: $connector, as: list }
  - forEach: $list.names
    steps:
      - deletePipeline: { connector: $connector, pipeline: $item }
